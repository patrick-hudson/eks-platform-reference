name: Terraform
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to run
        required: true
        type: choice
        default: dev
        options: [dev, prod]
      operation:
        description: Plan only, or plan and apply
        required: true
        type: choice
        default: plan
        options: [plan, apply]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: bash scripts/check.sh
      - run: bash scripts/test.sh
  deploy:
    name: Terraform (${{ matrix.target }})
    needs: validate
    # Fork code never receives an OIDC session or access to state. Its validate job still runs.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_dispatch' || inputs.operation == 'plan' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["dev", "prod"]') }}
    environment: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'plan')) && format('{0}-plan', matrix.target) || matrix.target }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-${{ matrix.target }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TARGET: ${{ matrix.target }}
      EVENT: ${{ github.event_name }}
      OPERATION: ${{ github.event_name == 'pull_request' && 'plan' || github.event_name == 'workflow_dispatch' && inputs.operation || 'apply' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-${{ github.run_id }}
          role-duration-seconds: 3600
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Plan or apply platform, then monitoring
        shell: bash
        run: bash scripts/deploy.sh
